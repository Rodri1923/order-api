name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tests
        run: dotnet test OrderSolution.slnx --logger "console;verbosity=normal"

  mutation:
    name: Mutation testing (Stryker)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Instalar Stryker
        run: dotnet tool install --global dotnet-stryker
      - name: Correr mutation testing
        working-directory: OrderApi.Tests
        run: dotnet stryker
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: OrderApi.Tests/StrykerOutput/**/reports/*
